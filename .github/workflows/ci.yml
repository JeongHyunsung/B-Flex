name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gzip

      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang gzip

      - name: Configure (ASan+UBSan)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBFLEX_ENABLE_ASAN=ON
          -DBFLEX_ENABLE_UBSAN=ON

      - name: Build (ASan+UBSan)
        run: cmake --build build-asan

      - name: Test (ASan+UBSan)
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

  sanitizer-tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang gzip

      - name: Configure (TSan)
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBFLEX_ENABLE_TSAN=ON

      - name: Build (TSan)
        run: cmake --build build-tsan

      - name: Test (TSan)
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build-tsan --output-on-failure

  python-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gzip

      - name: Install pyflex (editable)
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Import smoke test
        run: python -c "import pyflex; print(pyflex.__doc__)"

      - name: Run Python example
        run: python examples/dual_edge_flip_flop_3state.py
